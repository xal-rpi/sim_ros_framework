# Fixed frame-pacing profile — use via compose.sim in a run file.
#
#   compose:
#     sim: defaults/sim_fixed_step.yaml
#
# 60 graphics frames/s, with 1/60 vehicle seconds of physics per frame.
# The native physics rate remains unchanged (normally 2000 Hz); this is not LLC Hz.

beamng:
  open_args:
    launch: false
    debug: false
    extensions:
      - xlab/xlabCore
  setup_funcs:
    beamng.settings.set_deterministic:
      steps_per_second: 60
      speed_factor: -1
    beamng.ui.show_hud: {}
