# =============================================================================
# Simulator connection defaults (merged into every composed run).
# =============================================================================
#
# beamng.host / beamng.port — injected from launch if omitted here.
# beamng.open_args.launch: false  → connect to already-running BeamNG.tech.
# beamng.open_args.extensions     → xlab mod required for custom sensors/controllers.
# setup_funcs                     → explicit physics pacing; native physics rate is unchanged.

beamng:
  open_args:
    launch: false
    debug: false
    extensions:
      - xlab/xlabCore
  setup_funcs:
    # Frame-based pacing at the existing FPS limit; 1/fps vehicle seconds per frame.
    # Use speed_factor: 0 for wall-clock pacing. This does not set the frame limit.
    beamng.settings.set_deterministic:
      speed_factor: -1
    beamng.ui.show_hud: {}
